name: Import upstream PS5PCEM history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-upstream.yml'

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NEXORA with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge upstream source and history into a review branch
        shell: bash
        env:
          IMPORT_BRANCH: import/ps5pcem-upstream-${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/iStark/PS5PCEM.git
          git fetch --no-tags upstream main
          git switch -c "$IMPORT_BRANCH"
          # Preserve both histories; keep NEXORA's README/LICENSE on text conflicts.
          git merge --allow-unrelated-histories -X ours --no-edit upstream/main
          # No force push, no changes to main or the profiler branch.
          git push origin "HEAD:refs/heads/$IMPORT_BRANCH"
          echo "Imported source and history to $IMPORT_BRANCH" >> "$GITHUB_STEP_SUMMARY"
