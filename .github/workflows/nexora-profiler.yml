name: NEXORA frame profiler

on:
  push:
    branches: [feature/nexora-build-baseline]
    paths:
      - 'tools/profile_analyze.py'
      - 'tools/gpu_wait_audit.py'
      - 'tests/test_profile_analyze.py'
      - 'tests/test_gpu_wait_audit.py'
      - 'samples/frames.csv'
      - '.github/workflows/nexora-profiler.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profiler:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*audit.py' -v && python -m unittest discover -s tests -p 'test_profile_analyze.py' -v
      - name: Static GPU wait inventory
        run: python tools/gpu_wait_audit.py src --out gpu-wait-sites.json
      - name: Sample frame report
        run: python tools/profile_analyze.py samples/frames.csv --out frame-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: frame-report-${{ matrix.os }}
          path: |
            frame-report.json
            gpu-wait-sites.json
