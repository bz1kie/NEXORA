name: NEXORA Windows x64 build

on:
  push:
    branches: [feature/nexora-build-baseline]
    paths:
      - '.github/workflows/nexora-windows.yml'
      - 'src/**'
      - 'build.zig'
      - 'build.zig.zon'
      - 'assets/windows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - name: Build NEXORA (Windows x64, ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe
      - name: Verify graphical NEXORA executable
        shell: pwsh
        run: |
          if (!(Test-Path 'zig-out/bin/NEXORA.exe')) { throw 'NEXORA.exe was not produced' }
          if (!(Test-Path 'zig-out/bin/game-run.exe')) { throw 'game-run.exe companion was not produced' }
      - name: Package portable NEXORA ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path 'zig-out/bin/*' -DestinationPath 'dist/NEXORA-windows-x64-portable.zip' -Force
          if (!(Test-Path 'dist/NEXORA-windows-x64-portable.zip')) { throw 'Portable ZIP missing' }
      - name: Verify portable ZIP contents and SHA256
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          $zipPath = (Resolve-Path 'dist/NEXORA-windows-x64-portable.zip').Path
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @('NEXORA.exe', 'game-run.exe')) {
              if ($entries -notcontains $required) { throw "Portable ZIP missing $required" }
            }
            Write-Host "Validated $($entries.Count) ZIP entries"
          } finally {
            $archive.Dispose()
          }
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          "$hash  NEXORA-windows-x64-portable.zip" | Set-Content -Path 'dist/SHA256SUMS.txt' -Encoding ascii
          Write-Host "SHA256: $hash"
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-windows-x64-portable
          path: |
            dist/NEXORA-windows-x64-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-windows-x64-experimental
          path: zig-out/bin/
          if-no-files-found: error
          retention-days: 14
