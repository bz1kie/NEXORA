name: Profiler tests

on:
  push:
    branches: [main, feature/nexora-profiler]
  pull_request:
  workflow_dispatch:

jobs:
  profiler:
    name: Python profiler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test with sample frame capture
        run: python tools/profile_analyze.py samples/frames.csv --out profiler-summary.json
      - name: Upload profiler report
        uses: actions/upload-artifact@v4
        with:
          name: profiler-summary-${{ matrix.os }}
          path: profiler-summary.json
